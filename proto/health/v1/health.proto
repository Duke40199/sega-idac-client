syntax = "proto3";

package health.v1;

import "google/api/annotations.proto";

option go_package = "github.com/Duke40199/sega-idac-client/gen/healthv1;healthv1";

// HealthService exposes liveness/readiness information for the sega-idac-client
// service so that callers and orchestrators can probe it over gRPC (and over
// HTTP via grpc-gateway).
service HealthService {
  // Check returns the current serving status of the service.
  rpc Check(CheckRequest) returns (CheckResponse) {
    option (google.api.http) = {get: "/v1/health"};
  }
}

message CheckRequest {
  // Optional logical sub-service name to probe. Empty means the whole server.
  string service = 1;
}

message CheckResponse {
  enum ServingStatus {
    SERVING_STATUS_UNKNOWN_UNSPECIFIED = 0;
    SERVING_STATUS_SERVING = 1;
    SERVING_STATUS_NOT_SERVING = 2;
  }

  ServingStatus status = 1;
}
